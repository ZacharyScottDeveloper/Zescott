<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mission Control // Routing</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #0b0f19;
            color: #c9d1d9;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            padding: 20px;
            background-image: radial-gradient(rgba(255, 255, 255, 0.1) 1px, transparent 1px);
            background-size: 24px 24px;
            background-position: center;
            mask-image: radial-gradient(circle, rgba(0,0,0,1) 20%, rgba(0,0,0,0) 70%);
            -webkit-mask-image: radial-gradient(circle, rgba(0,0,0,1) 20%, rgba(0,0,0,0) 70%);
        }
        .container {
            max-width: 600px;
            width: 100%;
            border: 2px solid #30363d;
            background-color: #161b22;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            text-align: center;
            transition: all 0.3s ease;
            position: relative;
            z-index: 1;
        }
        .container.error-state {
            border-color: #f85149;
            box-shadow: 0 8px 24px rgba(248, 81, 73, 0.15);
        }
        h1 {
            font-size: 1.5rem;
            color: #58a6ff;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .container.error-state h1 {
            color: #f85149;
        }
        p {
            font-size: 1rem;
            line-height: 1.6;
            margin-bottom: 20px;
        }
        .status-box {
            background-color: #0d1117;
            border: 1px solid #30363d;
            padding: 15px;
            border-radius: 6px;
            font-size: 0.9rem;
            color: #8b949e;
            display: inline-block;
            min-width: 250px;
        }
        .container.error-state .status-box {
            border-color: #f85149;
            color: #ff7b72;
        }
        .home-btn {
            display: inline-block;
            margin-top: 25px;
            padding: 10px 20px;
            background-color: #21262d;
            color: #c9d1d9;
            text-decoration: none;
            border: 1px solid #30363d;
            border-radius: 6px;
            font-weight: bold;
            transition: all 0.2s;
        }
        .home-btn:hover {
            background-color: #30363d;
            border-color: #8b949e;
            color: #ffffff;
        }
        .cursor {
            display: inline-block;
            width: 8px;
            height: 15px;
            background-color: #58a6ff;
            margin-left: 5px;
            animation: blink 1s infinite;
        }
        .container.error-state .cursor {
            background-color: #f85149;
        }
        @keyframes blink {
            0%, 49% { opacity: 1; }
            50%, 100% { opacity: 0; }
        }
    </style>
</head>
<body>

    <div id="card" class="container">
        <h1 id="title">🛰️ Mission Control</h1>
        <p id="description">Establishing downlink data sequence to decipher your routing path...</p>
        <div class="status-box">
            <span id="msg">Contacting mission control...</span><span id="cursor" class="cursor"></span>
        </div>
        <div id="actionArea"></div>
    </div>

    <script>
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzIEbYZ7h6dGXZY2_lBfK7M5RQVk5byKCSHa9cdCpTtXK2V2vvboQGhA3detWWPCavESQ/exec";

        async function processRedirect() {
            const path = window.location.pathname;
            const slug = path.replace(/^\/|\/\$/g, ''); 

            if (!slug || slug === 'url-shortener' || slug === 'index.html') {
                trigger404("No direct flight path provided.");
                return;
            }

            try {
                const response = await fetch(`${GOOGLE_SCRIPT_URL}?slug=${slug}`, { redirect: "follow" });
                const destinationUrl = await response.text();

                if (destinationUrl !== "NOT_FOUND" && destinationUrl.trim() !== "") {
                    document.getElementById('msg').innerText = "Trajectory found! Redirecting...";
                    window.location.href = destinationUrl.trim();
                } else {
                    trigger404(`Data node "${slug}" does not exist in our telemetry.`);
                }
            } catch (err) {
                trigger404("Comms blackout. Unable to reach database servers.");
            }
        }

        function trigger404(reasonMessage) {
            document.getElementById('card').classList.add('error-state');
            document.getElementById('title').innerText = "🚨 404 - Orbit Lost";
            document.getElementById('description').innerText = reasonMessage;
            document.getElementById('msg').innerText = "Signal lost. Sequence halted.";
            
            const actionArea = document.getElementById('actionArea');
            if (actionArea.innerHTML === "") {
                const homeBtn = document.createElement('a');
                homeBtn.href = "https://zescott.com";
                homeBtn.className = "home-btn";
                homeBtn.innerText = "Return to Launchpad";
                actionArea.appendChild(homeBtn);
            }
        }

        processRedirect();
    </script>
</body>
</html>
