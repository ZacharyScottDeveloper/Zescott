<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Redirecting...</title></head>
<body>
    <h2 id="msg">Checking database...</h2>

    <script>
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx-IaHLMJWiwXeXcozM6QVXDEhNSv2FgVAXt5R_5uZ-Cvkvce5LjlesGO5ncIjVvWlv6w/exec";

        async function processRedirect() {
            const path = window.location.pathname;
            const slug = path.replace(/^\/|\/$/g, ''); 

            if (!slug || slug === 'url-shortener') {
                document.getElementById('msg').innerText = "Invalid link.";
                return;
            }

            try {
                const response = await fetch(`${GOOGLE_SCRIPT_URL}?slug=${slug}`, { redirect: "follow" });
                const destinationUrl = await response.text();

                if (destinationUrl !== "NOT_FOUND") {
                    document.getElementById('msg').innerText = "Redirecting...";
                    window.location.href = destinationUrl.trim();
                } else {
                    document.getElementById('msg').innerText = "Link not found in database.";
                }
            } catch (err) {
                document.getElementById('msg').innerText = "Error contacting database.";
            }
        }

        processRedirect();
    </script>
</body>
</html>
