<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>zsDev</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="desktop-container">
        
        <div id="program" class="program">
            <div class="shortcut" data-website="portfolio">
                <div class="icon porticon"></div>
                <div class="label">Who Am I?</div>
            </div>
            <div class="shortcut" data-website="resume">
                <div class="icon resicon"></div>
                <div class="label">Resume</div>
            </div>
            <div class="shortcut" data-website="blog">
                <div class="icon blogicon"></div>
                <div class="label">Blog</div>
            </div>
            <!--<div class="shortcut" data-website="cool-facts">
                <div class="icon intfacticon"></div>
                <div class="label">Cool Facts</div>
            </div>-->
            <!-- <div class="shortcut" data-website="billybit">
                <div class="icon billybiticon"></div>
                <div class="label">BillyBit</div>
            </div> -->
            <div class="shortcut" data-website="billy-bot">
                <div class="icon billyboticon"></div>
                <div class="label">BillyBot</div>
            </div>
        </div>


        <div id="desktop-windows"></div>

   
        <div class="taskbar">
            <div class="start-button">
                <span class="start-icon">🏁</span> Start
            </div>
            <div id="taskbar-tabs" class="taskbar-tabs-container"></div>
            <div class="taskbar-clock" id="clock">00:00 PM</div>
        </div>

    </div>

    <script src="scripts.js"></script>
</body>
</html>
