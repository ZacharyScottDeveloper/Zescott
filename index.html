<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>zsDev</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <style>
    canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      display: block;
    }
  
    .bg-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
    }
  
    .mythology-image {
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      max-height: 80%;
      max-width: 60%;
      opacity: 0.5;
      filter: drop-shadow(0 0 30px rgba(150, 100, 200, 0.4));
    }
  
    .mythology-image.glitch {
      animation: glitch 0.15s infinite;
    }
  
    @keyframes glitch {
      0% {
        clip-path: polygon(0 0, 100% 0, 100% 20%, 0 20%);
        transform: translateX(-50%) translateX(2px);
      }
      20% {
        clip-path: polygon(0 30%, 100% 30%, 100% 60%, 0 60%);
        transform: translateX(-50%) translateX(-2px);
      }
      40% {
        clip-path: polygon(0 70%, 100% 70%, 100% 100%, 0 100%);
        transform: translateX(-50%) translateX(1px);
      }
      60% {
        clip-path: polygon(0 10%, 100% 10%, 100% 40%, 0 40%);
        transform: translateX(-50%) translateX(-1px);
      }
      80% {
        clip-path: polygon(0 50%, 100% 50%, 100% 90%, 0 90%);
        transform: translateX(-50%) translateX(2px);
      }
      100% {
        clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%);
        transform: translateX(-50%) translateX(0);
      }
    }
  </style>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
    <canvas id="bg-canvas"></canvas>

    <div class="bg-container">
        <img id="mythology-img" class="mythology-image" src="Myth/Athena.png" alt="Mythology">
    </div>
    <div class="desktop-container">
        
        <div id="program" class="program">
            <div class="shortcut" data-website="portfolio">
                <div class="icon porticon"></div>
                <div class="label">Who Am I?</div>
            </div>
            <div class="shortcut" data-website="resume">
                <div class="icon resicon"></div>
                <div class="label">Resume</div>
            </div>
            <div class="shortcut" data-website="blog">
              <a href='https://zacharyscottblog.blogspot.com/' target="_blank">
                <div class="icon blogicon"></div>
                <div class="label">Blog</div>
              </a>
            </div>
            <div class="shortcut" data-website="billy-bot">
                <div class="icon billyboticon"></div>
                <div class="label">BillyBot</div>
            </div>
        </div>


        <div id="desktop-windows"></div>

   
        <div class="taskbar">
            <div class="start-button">
                <span class="start-icon">🏁</span> Start
            </div>
            <div id="taskbar-tabs" class="taskbar-tabs-container"></div>
            <div class="taskbar-clock" id="clock">00:00 PM</div>
        </div>

    </div>

    <script src="scripts.js"></script>
</body>
</html>
